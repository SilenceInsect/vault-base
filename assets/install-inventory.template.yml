# 共享金库安装信息 · 物料清单（模板）
# 逻辑归属：team-type:team-name → teams/<type>/<name>/install-inventory.yml
# 用法：复制本文件到组目录后，由 vault-base skill 逐项提问补齐；勿把密码写进本文件的已填样例仓库。

schema_version: 1
doc_type: install_inventory

# 组标识（与 teams/ 约定一致）
team:
  id: ""                         # 必填 例 test-team:amrd-test
  team_type: ""                  # 必填 例 test-team
  team_name: ""                  # 必填 例 amrd-test
  display_name: ""               # 可选 展示名
  owners: []                     # 可选 负责人域账号列表

# 用户级公共 skill 仓（真相源；各 IDE 只建联接）
common_skills_repo:
  path: ""                       # 必填 默认 ~/common-skills-repo
  skill_name: "vault-base"       # 仓内目录名
  # ------------------------------------------------------------------
  # link_mode 枚举（三选一；打开本文件即可看到，不必翻别处）
  #   junction — Windows 目录联接（推荐；mklink /J，通常无需管理员）
  #   symlink  — 符号链接（跨平台；Windows 常需开发者模式或管理员）
  #   copy     — 仅拷贝到 IDE 目录（易与真相源分叉，不推荐）
  # 出处索引：
  #   - 字段说明 → references/install-inventory.md §「联接模式 link_mode」
  #   - 实现逻辑 → scripts/common_skills_repo.py（create_junction / link）
  # ------------------------------------------------------------------
  link_mode: "junction"          # 枚举见上；默认 junction
  # ------------------------------------------------------------------
  # ide_links：是否对本机该 IDE 建联接（true/false）
  #   规则：按「本机是否已安装/在用该 IDE」设值，禁止模板默认全 true。
  #   init / refresh-ide-links 会探测回填；勿仅因存在 ~/.xxx/skills 就判 true
  #   （skills 目录可能是联接脚本创建的）。
  # 探测实现：scripts/common_skills_repo.py → detect_ide_links()
  # 回填命令：python scripts/install_inventory.py refresh-ide-links --id <id>
  # ------------------------------------------------------------------
  ide_links:
    cursor: false                # 探测：Cursor.exe / ~/.cursor 强标记
    claude: false                # 探测：Claude 应用或实质家目录（仅 skills 不算）
    codex: false                 # 探测：codex CLI / ~/.codex 配置会话
    workbuddy: false             # 探测：WorkBuddy 应用或 ~/.workbuddy 数据

# 安装目标
install:
  # ------------------------------------------------------------------
  # install.mode 枚举（三选一）— 决策：共享优先 / 本地降级
  #   shared_full       — 共享 Redis+MySQL 可用：Redis vault:c: 为真相源；
  #                       本地 references/vault 可跳过（vault_root 可空）
  #   local_only        — 无共享时降级：仅本地用户目录文件仓
  #   local_then_shared — 显式双写（兼容旧流程；非默认）
  # bootstrap probe-connection 会按探活结果回写 mode。
  # 出处：references/install-inventory.md §「安装模式 install.mode」
  # ------------------------------------------------------------------
  mode: "shared_full"            # 枚举见上；默认 shared_full（安装意图）
  skill_root: ""                 # 建议填 = <common_skills_repo.path>/<skill_name>
  vault_root: ""                 # local_only 必填；shared_full 可空=跳过本地仓
  # 解析回填：本机复用或新装后的 python.exe（与 install.python 联动）
  python_exe: ""                 # local_only / local_then_shared 必填
  svn_url: ""                    # 可选 skill/Vault 纳管 SVN 地址
  git_local_only: true           # 本地 Vault Git 禁止推远端

  # ---- 本机可安装组件 ----
  # 约定：enabled=true 且本机不满足 min_accept → 按 default_version 装到 install_path（默认在 skill 目录下）
  #       本机已满足 min_accept → 复用，不强制重装；pip 包无独立 install_path（进 python_exe 环境）

  python:
    enabled: true                # 默认安装（本机无满足版本时）
    min_accept: "3.10"           # 本机已有 ≥3.10 可复用
    default_version: "3.11.5"    # 需新装时目标：3.11.5+
    install_path: ""             # 默认 <skill_root>/Python；空则用该默认

  git:
    enabled: true                # clone / 增量扫描依赖（E3）
    min_accept: "2.30.0"         # 本机已有 ≥2.30 可复用
    default_version: "2.47.1"    # 需新装时目标版本
    install_path: ""             # 默认 <skill_root>/Git；空则用该默认
    exe: ""                      # 解析回填 git.exe

  # pip 包：装进 install.python_exe 环境；无独立目录。env_ensure 可自动补齐。
  pip:
    pymysql:
      enabled: true              # 共享 MySQL（E2）；本地-only 可暂缺
      min_accept: ""             # 已装任意版本即可
      default_version: ""        # 空=pip 最新
    pyyaml:
      enabled: true              # 清单完整写回；无则脚本走迷你解析（只读）
      min_accept: ""
      default_version: ""        # 空=pip 最新

  # Obsidian 客户端（Markdown Vault 浏览/编辑；脚本读写不依赖客户端）
  obsidian:
    enabled: true                # 是否安装 Obsidian；默认 true
    min_accept: ""               # 已装任意版本可复用
    default_version: "latest"    # 官方最新稳定版
    install_path: ""             # 默认 <skill_root>/Obsidian；空则用该默认

  # SVN 客户端（可选；仅 svn_url / X7 时需要）
  svn:
    enabled: false               # 默认不装
    min_accept: "1.14.0"
    default_version: "1.14.5"
    install_path: ""             # 默认 <skill_root>/SVN；空则用该默认
    exe: ""                      # 解析回填 svn.exe

# 共享环境（208）— 无则只能本地降级；不在本机安装，无 install_path
shared_env:
  redis:
    host: ""                     # 必填(共享模式) 例 <SHARED_HOST>
    port: 6379
    db: 0
    password: ""                 # 敏感：写 secrets.local.json，这里可留空或填 <in_secrets>
    requirepass_set: null        # 探测后回填 true/false
    supports_stream: null        # 探测后回填；3.2.x 应为 false
    # 服务端版本约定（运维侧，非本机安装）：3.2.12 → LIST 后端
    expected_version: "3.2.12"
  mysql:
    host: ""                     # 必填(共享模式)
    port: 3306
    user: ""                     # 必填(共享模式)
    password: ""                 # 敏感：只进 secrets.local.json
    database: "amrd_qa_vault"    # 必填(共享模式)
    charset: "utf8mb4"
    # 客户端用 pymysql；服务端版本由 DBA 管理，本机不装 mysqld
    expected_charset: "utf8mb4"
  secrets_path: ""               # 必填(共享模式) → references/vault/_kb/secrets.local.json

# 旧知识金库发现与纳入（安装后探测；有则须纳入同步计划，禁止静默忽略）
# sync_policy:
#   review_then_import — 默认：导入待审队列，人工审核进 shared_vault_main
#   import_pending     — 直接进 pending
#   skip               — 显式跳过（须填 skip_reason）
legacy_vaults:
  discover_on_install: true      # 安装/探测时扫描已知旧库
  sync_required_if_found: true   # 发现旧库则必须纳入（或显式 skip）
  sources:
    - id: "amrd_qa_kb"
      kind: "bug-vault"          # bug-vault / 旧 KB
      mysql_database: "amrd_qa_kb"
      redis_prefix: "kb:"
      local_path: ""             # 例 <local-kb-root>/bug-vault；探测后回填
      schema_meta_key: "schema_version"  # kb_meta
      enabled: true
      sync_policy: "review_then_import"
      skip_reason: ""
      discovered: null           # 探测回填 true/false
      last_sync_at: ""
      notes: "与 vault-base 边界隔离；纳入时映射为 answer/decision，锚点索引可分期迁"

# 外部协调项（安装手册 X-*）
# 状态枚举：unknown 未知 | requested 已申请 | done 已完成 | blocked 受阻
coordination:
  X4_create_database: "unknown"  # 建库权限：unknown|requested|done|blocked
  X5_ddl_impact_review: "unknown"  # DDL 影响面评估
  X1_redis_aof: "unknown"        # Redis AOF 持久化确认
  X2_redis_requirepass: "unknown"  # Redis 口令策略确认
  X7_svn_precommit: "unknown"    # SVN 预提交钩子确认
  notes: ""

# 本机组信息（可指向 team.yml）
local:
  author: ""                     # 必填 域账号/姓名
  author_ip: ""                  # 可选 探测回填
  machine_note: ""

# 验收勾选（由脚本/skill 回写）
checklist:
  env_ensure_ok: false           # 环境骨架已就绪
  readiness_ready: false         # readiness_gate 通过
  can_write_local: false         # 可写本地 Vault
  can_write_shared: false        # 可写共享库
  probe_redis_ok: false          # Redis 探测通过
  probe_mysql_ok: false          # MySQL 探测通过
  team_workspace_created: false  # 组目录已创建
  secrets_file_present: false    # secrets.local.json 已存在
  ddl_applied: false             # DDL 已落地
  common_repo_ready: false       # common-skills-repo 已建
  ide_links_ready: false         # IDE 联接已就绪
  python_ready: false            # Python ≥min_accept 或已按 default_version 安装
  git_ready: false               # Git 可用
  pip_pymysql_ok: false          # pymysql 已装入 python_exe
  pip_pyyaml_ok: false           # PyYAML 已装入 python_exe
  obsidian_installed: false      # Obsidian 已按清单安装
  svn_ready: false               # SVN 可用（仅 enabled 时）
  legacy_vaults_scanned: false   # 已扫描旧库（amrd_qa_kb 等）
  legacy_vaults_synced_or_skipped: false  # 旧库已纳入或显式 skip

# 访谈进度：pending 待开始 | asked 已提问 | filled 已填齐 | skipped 已跳过
interview:
  status: "pending"              # 默认：待开始
  missing_fields: []             # skill/脚本自动列出未填必填项
  updated_at: ""
