# 可选：用官方镜像习惯时的 Compose 骨架。
# 上游亦提供 docs/docker.md；若拉取失败请改用本机 pip：
#   pip install "laya[serve]" && set LAYA_HOST=127.0.0.1&& laya-serve
services:
  laya-serve:
    image: python:3.12-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q 'laya[serve]'
      && LAYA_HOST=0.0.0.0 LAYA_PORT=8000 LAYA_DEVICE=cpu LAYA_PRELOAD=1
         LAYA_MODELS=typed-decisions laya-serve"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - laya-hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  laya-hf-cache:
